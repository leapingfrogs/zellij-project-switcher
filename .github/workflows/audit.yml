name: Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Advisories are published independently of commits to this repo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    runs-on: ubuntu-latest

    steps:
    # Before checkout: .cargo/config.toml sets build.target to wasm32-wasip1,
    # which cargo install would otherwise pick up.
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked --version 0.22.2

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run cargo audit
      run: cargo audit
