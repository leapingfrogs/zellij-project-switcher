name: Rust

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup `wasmtime`
      uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
    - name: Add wasm32-wasip1 target
      run: rustup target add wasm32-wasip1
    - name: Run tests
      run: cargo test --locked --target wasm32-wasip1

  build:
    needs: test

    runs-on: ubuntu-latest

    # The only job that can write to the repository, so it runs no more
    # third-party code than publishing requires.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Add wasm32-wasip1 target
      run: rustup target add wasm32-wasip1
    - name: Build
      run: cargo build --locked --target wasm32-wasip1 --release --features tracing
    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: target/wasm32-wasip1/release/zellij-project-switcher-plugin.wasm
    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      if: startswith(github.ref, 'refs/tags/')
      with:
        files: target/wasm32-wasip1/release/zellij-project-switcher-plugin.wasm
